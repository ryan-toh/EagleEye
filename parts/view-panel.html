<section class="panel viewer-panel hidden" id="view-panel">
  <div class="viewer-panel__header">
    <div>
      <h2>View a decision tree</h2>
      <p class="helper-text">
        Select a topic, then choose an issue to generate the decision tree.
      </p>
    </div>
  </div>

  <!-- Hidden values keep the existing controller-style getter/setter API working -->
  <input type="hidden" id="topicSelect" value="">
  <input type="hidden" id="issueSelect" value="">

  <div class="decision-explorer">
    <section class="decision-explorer__pane decision-explorer__pane--topics">
      <div class="decision-explorer__pane-header">
        <h3>Topics</h3>
        <p class="helper-text">Choose a topic</p>
      </div>

      <div 
        class="decision-explorer__list" 
        id="topicList"
        aria-label="Topics"
      >
        <div class="decision-explorer__empty">
          Load files first
        </div>
      </div>
    </section>

    <section class="decision-explorer__pane decision-explorer__pane--issues">
      <div class="decision-explorer__pane-header">
        <h3>Issues</h3>
        <p class="helper-text" id="issuePaneHint">
          Select a topic first
        </p>
      </div>

      <div 
        class="decision-explorer__list" 
        id="issueList"
        aria-label="Issues"
      >
        <div class="decision-explorer__empty">
          Select a topic first
        </div>
      </div>
    </section>
  </div>
</section>
