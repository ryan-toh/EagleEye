<section class="panel controls hidden" id="view-panel">
  <div class="panel__header-row">
    <h2>View a decision tree</h2>
    <div class="panel__label-row">
      <p class="helper-text">Choose a topic from the dropdown.</p>
      <label>
        Topic
        <select id="topicSelect" disabled="">
          <option value="">Load files first</option>
        </select>
      </label>
      <p class="helper-text">Choose a issue from the dropdown.</p>
      <label>
        Issue
        <select id="issueSelect" disabled="">
          <option value="">Select a topic first</option>
        </select>
      </label>
    </div>
  </div>
</section>
