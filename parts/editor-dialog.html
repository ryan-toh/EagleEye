<section class="dialog-panel">
  <dialog id="editorTopicDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close topic dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Topic</h3>
    <!-- <label>Topic ID <input id="editorTopicId" type="text" /></label> -->
    <label class="hidden"
      >Topic ID <input id="editorTopicId" type="text"
    /></label>
    <label>Topic name <input id="editorTopicName" type="text" /></label>
    <label
      >Description <textarea id="editorTopicDescription" rows="3"></textarea>
    </label>
    <label
      >Example phrases <textarea id="editorTopicExamples" rows="3"></textarea>
    </label>
    <button id="saveTopicBtn" type="button">Save topic</button>
  </dialog>

  <dialog id="editorQuestionDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close question dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Question</h3>
    <!-- <label>Question ID <input id="editorQuestionId" type="text" /></label> -->
    <label class="hidden"
      >Question ID <input id="editorQuestionId" type="text"
    /></label>
    <label>Question name <input id="editorQuestionName" type="text" /></label>
    <label
      >Question description
      <textarea id="editorQuestionDescription" rows="3"></textarea>
    </label>
    <label
      >Example phrases <textarea id="editorQuestionExamples" rows="3"></textarea>
    </label>
    <button id="saveQuestionBtn" type="button">Save question</button>
  </dialog>

  <dialog id="editorParamDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close leadingQuestion dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>LeadingQuestion</h3>
    <!-- <label>LeadingQuestion ID <input id="editorLeadingQuestionId" type="text" /></label> -->
    <label class="hidden"
      >LeadingQuestion ID <input id="editorLeadingQuestionId" type="text"
    /></label>
    <label>LeadingQuestion name <input id="editorLeadingQuestionName" type="text" /></label>
    <label
      >Question to ask
      <textarea id="editorLeadingQuestionQuestion" rows="3"></textarea>
    </label>
    <label>
      Required
      <select id="editorLeadingQuestionRequired">
        <option value="yes">yes</option>
        <option value="no">no</option>
      </select>
    </label>
    <label>
      Allowed values
      <p class="helper-text">
        Seperate the values with ';' or ',' or a new line.
      </p>
      <textarea
        id="editorLeadingQuestionAllowedValues"
        rows="3"
        placeholder="yes, no, unclear"
      ></textarea>
    </label>
    <label
      >Example values
      <textarea id="editorLeadingQuestionExampleValues" rows="2"></textarea>
    </label>
    <label
      >Order <input id="editorLeadingQuestionOrder" type="number" min="1"
    /></label>
    <button id="saveLeadingQuestionBtn" type="button">Save leadingQuestion</button>
  </dialog>

  <dialog id="editorAnswerDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close answer dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Answer</h3>
    <label class="hidden"
      >Answer ID <input id="editorAnswerId" type="text"
    /></label>
    <label>
      Final decision
      <input id="editorAnswerDecision" type="text" />
    </label>
    <label
      >Final response
      <textarea id="editorAnswerText" rows="3"></textarea>
    </label>
    <label
      >Next steps
      <textarea id="editorAnswerNextSteps" rows="2"></textarea>
    </label>
    <label
      >Escalation note
      <textarea id="editorAnswerEscalationNote" rows="2"></textarea>
    </label>
    <fieldset class="answer-assignments-fieldset">
      <legend>Assign when</legend>
      <p class="helper-text">
        Add only the answers needed to give this answer. Any leadingQuestion
        not included here is not needed for this answer.
      </p>
      <div id="editorAnswerAssignments"></div>
      <button id="addAnswerAssignmentBtn" type="button">
        Add assignment
      </button>
    </fieldset>
    <button id="saveAnswerBtn" type="button">
      Save answer
    </button>
  </dialog>
</section>
