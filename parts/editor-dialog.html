<section class="dialog-panel">
  <dialog id="editorTopicDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close topic dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Topic</h3>
    <!-- <label>Topic ID <input id="editorTopicId" type="text" /></label> -->
    <label class="hidden"
      >Topic ID <input id="editorTopicId" type="text"
    /></label>
    <label>Topic name <input id="editorTopicName" type="text" /></label>
    <label
      >Description <textarea id="editorTopicDescription" rows="3"></textarea>
    </label>
    <label
      >Example phrases <textarea id="editorTopicExamples" rows="3"></textarea>
    </label>
    <button id="saveTopicBtn" type="button">Save topic</button>
  </dialog>

  <dialog id="editorIssueDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close issue dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Issue</h3>
    <!-- <label>Issue ID <input id="editorIssueId" type="text" /></label> -->
    <label class="hidden"
      >Issue ID <input id="editorIssueId" type="text"
    /></label>
    <label>Issue name <input id="editorIssueName" type="text" /></label>
    <label
      >Issue description
      <textarea id="editorIssueDescription" rows="3"></textarea>
    </label>
    <label
      >Example phrases <textarea id="editorIssueExamples" rows="3"></textarea>
    </label>
    <button id="saveIssueBtn" type="button">Save issue</button>
  </dialog>

  <dialog id="editorParamDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close parameter dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Parameter</h3>
    <!-- <label>Parameter ID <input id="editorParameterId" type="text" /></label> -->
    <label class="hidden"
      >Parameter ID <input id="editorParameterId" type="text"
    /></label>
    <label>Parameter name <input id="editorParameterName" type="text" /></label>
    <label
      >Question to ask
      <textarea id="editorParameterQuestion" rows="3"></textarea>
    </label>
    <label>
      Required
      <select id="editorParameterRequired">
        <option value="yes">yes</option>
        <option value="no">no</option>
      </select>
    </label>
    <label>
      Allowed values
      <p class="helper-text">
        Seperate the values with ';' or ',' or a new line.
      </p>
      <textarea
        id="editorParameterAllowedValues"
        rows="3"
        placeholder="yes, no, unclear"
      ></textarea>
    </label>
    <label
      >Example values
      <textarea id="editorParameterExampleValues" rows="2"></textarea>
    </label>
    <label
      >Order <input id="editorParameterOrder" type="number" min="1"
    /></label>
    <button id="saveParameterBtn" type="button">Save parameter</button>
  </dialog>

  <dialog id="editorRecommendationDialog" class="editor-card">
    <form method="dialog" class="editor-dialog__close-form">
      <button
        class="editor-dialog__close"
        type="submit"
        aria-label="Close recommendation dialog"
        title="Close"
      >
        ×
      </button>
    </form>
    <h3>Recommendation</h3>
    <label class="hidden"
      >Recommendation ID <input id="editorRecommendationId" type="text"
    /></label>
    <label>
      Final decision
      <input id="editorRecommendationDecision" type="text" />
    </label>
    <label
      >Final response
      <textarea id="editorRecommendationText" rows="3"></textarea>
    </label>
    <label
      >Next steps
      <textarea id="editorRecommendationNextSteps" rows="2"></textarea>
    </label>
    <label
      >Escalation note
      <textarea id="editorRecommendationEscalationNote" rows="2"></textarea>
    </label>
    <fieldset class="recommendation-assignments-fieldset">
      <legend>Assign when</legend>
      <p class="helper-text">
        Add only the answers needed to give this recommendation. Any parameter
        not included here is not needed for this answer.
      </p>
      <div id="editorRecommendationAssignments"></div>
      <button id="addRecommendationAssignmentBtn" type="button">
        Add assignment
      </button>
    </fieldset>
    <button id="saveRecommendationBtn" type="button">
      Save recommendation
    </button>
  </dialog>
</section>
