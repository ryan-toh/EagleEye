<section class="panel" id="upload-panel">
  <h2>Upload your Decision Tree Excel File.</h2>
  <p class="helper-text">It should be of '.xls' or '.xlsx' format.</p>

  <p class="helper-text">
    Don't know what to do? Read the user guide
    <a href="user-guide.html" target="_blank">here</a>
  </p>

  <div class="upload-grid">
    <input type="file" id="botInputFile" accept=".xlsx,.xls" />
  </div>
  <button id="loadBtn">Load and Continue</button>
  <button id="loadLocalBtn">Resume Previous Session</button>

  <p class="helper-text">Don't have one? Click to download a Template.</p>
  <button id="downloadSheetTemplateBtn">Download a Template</button>
  <br />
  <p class="helper-text">
    WARNING: You may need to assign a security classification to the template
    file first.
  </p>

  <p id="loadStatus" class="status"></p>
</section>
