<section class="preview-panel hidden" id="preview-panel">
  <section id="flowchartPanel" class="panel flowchart-panel">
    <div class="flowchart-header">
      <h2>Generated Flowchart</h2>
      <div class="flowchart-actions">
        <button id="copyMermaidBtn" disabled="">Copy Mermaid</button>
        <button
          id="fullscreenFlowchartBtn"
          class="fullscreen-flowchart-btn"
          type="button"
          aria-label="Enter fullscreen"
          aria-pressed="false"
          title="Enter fullscreen"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
          </svg>
        </button>
      </div>
    </div>
    <br />
    <div id="flowchart" class="flowchart empty">
      Load files and select an question.
    </div>
  </section>

  <section class="question-summary panel">
    <header class="question-summary__header">
      <div>
        <h2 id="questionSummaryName">No question selected</h2>
        <p id="questionSummaryDescription" class="question-summary__description">
          Select an question to review its decision setup.
        </p>
      </div>
      <div class="question-summary__counts" aria-label="Question totals">
        <span id="leadingQuestionCount" class="question-summary__count"
          >0 leading questions</span
        >
        <span id="ruleCount" class="question-summary__count">0 rules</span>
        <span id="answerCount" class="question-summary__count"
          >0 answers</span
        >
      </div>
    </header>
    <div class="preview-grid">
      <article class="preview-card">
        <header class="preview-card__header">
          <h3>Leading Questions</h3>
          <span id="leadingQuestionCardCount" class="preview-card__count">0</span>
        </header>
        <div id="leadingQuestionsList" class="empty">No question selected.</div>
      </article>
      <article class="preview-card">
        <header class="preview-card__header">
          <h3>Matching rules</h3>
          <span id="ruleCardCount" class="preview-card__count">0</span>
        </header>
        <div id="rulesList" class="empty">No question selected.</div>
      </article>
      <article class="preview-card">
        <header class="preview-card__header">
          <h3>Answers</h3>
          <span id="answerCardCount" class="preview-card__count"
            >0</span
          >
        </header>
        <div id="answersList" class="empty">No question selected.</div>
      </article>
    </div>
  </section>
</section>
